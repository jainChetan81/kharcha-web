<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings · categories</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@keyframes ai-shift{0%{background-position:0% 50%}100%{background-position:100% 50%}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}

</style>
</helmet>
<div style="{{vars}} position: relative; overflow: hidden; background: var(--paper); color: var(--ink); font-family: 'IBM Plex Sans', system-ui, sans-serif; font-variant-numeric: tabular-nums lining-nums; width: 390px; height: 844px">

  <div aria-hidden="true" style="padding: 16px 20px; display: flex; flex-direction: column; gap: 12px">
    <span style="font-family: 'Newsreader', Georgia, serif; font-size: 26px">Settings</span>
    <span style="height: 44px; border-radius: 10px; border: 1px solid var(--field)"></span>
    <span style="display: flex; gap: 8px"><span style="width: 150px; height: 44px; border-radius: 999px; border: 1px solid var(--field)"></span><span style="width: 90px; height: 44px; border-radius: 999px; border: 1px solid var(--field)"></span><span style="width: 100px; height: 44px; border-radius: 999px; border: 1px solid var(--field)"></span></span>
  </div>
  <div style="position: absolute; inset: 0; background: var(--scrim)"></div>
  <section role="dialog" aria-modal="true" aria-labelledby="cat-t" style="position: absolute; left: 0; right: 0; bottom: 0; top: 56px; background: var(--card); border-radius: 20px 20px 0 0; display: flex; flex-direction: column; box-shadow: 0 -8px 24px var(--shadow); overflow: hidden">
    <header style="display: flex; align-items: center; gap: 4px; padding: 12px 12px 8px 20px">
      <h2 id="cat-t" style="margin: 0 auto 0 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 22px">Categories</h2><button type="button" style="min-height: 44px; padding: 0 8px; border: 0; background: transparent; color: var(--brand); font-size: 14px; font-weight: 500; cursor: pointer">Add</button>
      <a href="Settings.dc.html" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--ink)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    </header>
    <div style="flex: 1; min-height: 0; overflow: auto; padding: 0 20px 34px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; flex-direction: column">      <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
        <div style="display: flex; flex-direction: column">
          <h3 style="margin: 18px 0 2px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink3); font-weight: 500">{{g.name}}</h3>
          <sc-for list="{{g.items}}" as="c" hint-placeholder-count="5">
            <div style="border-bottom: 1px solid var(--hair)">
              <div style="display: flex; align-items: center; gap: 4px; min-height: 56px">
                <button type="button" aria-label="{{c.dragLabel}}" style="width: 32px; height: 44px; border: 0; background: transparent; color: var(--ink3); display: flex; align-items: center; justify-content: center; cursor: grab"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/></svg></button>
                <button type="button" onClick="{{c.pick}}" aria-label="{{c.swLabel}}" aria-expanded="{{c.open}}" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><span style="width: 24px; height: 24px; border-radius: 7px; background: {{c.color}}; box-shadow: {{c.ring}}"></span></button>
                <label style="flex: 1; min-width: 0; max-width: 320px; display: flex; flex-direction: column">
                  <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{c.nameLabel}}</span>
                  <input value="{{c.name}}" style="width: 100%; box-sizing: border-box; min-height: 44px; padding: 0 8px; border: 0; border-bottom: 1px dashed var(--field); border-radius: 0; background: transparent; color: var(--ink); font-size: 15px; font-weight: 500; outline: none">
                </label>
                <span style="font-size: 12px; color: var(--ink3); white-space: nowrap">{{c.count}}</span>
                <a href="{{c.delHref}}" aria-label="{{c.delLabel}}" style="width: 40px; height: 44px; display: flex; visibility: {{c.delShow}}; align-items: center; justify-content: center; color: var(--ink3)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg></a>
              </div>
              <sc-if value="{{c.open}}" hint-placeholder-val="{{ false }}">
                <div role="radiogroup" aria-label="{{c.pickerLabel}}" style="margin: 0 0 12px 36px; padding: 10px; border-radius: 12px; border: 1px solid var(--rule); background: var(--card); box-shadow: 0 6px 16px var(--shadow); display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px">
                  <sc-for list="{{c.swatches}}" as="w" hint-placeholder-count="14">
                    <button type="button" role="radio" aria-checked="{{w.on}}" aria-label="{{w.name}}" onClick="{{w.fn}}" style="width: 100%; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><span style="width: 28px; height: 28px; border-radius: 8px; background: {{w.color}}; box-shadow: {{w.ring}}; display: flex; align-items: center; justify-content: center; color: #FFFFFF"><sc-if value="{{w.tick}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg></sc-if></span></button>
                  </sc-for>
                </div>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </sc-for>
</div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark": {"editor": "boolean", "default": false}, "aioff": {"editor": "boolean", "default": false}, "notinstalled": {"editor": "boolean", "default": false}, "minioff": {"editor": "boolean", "default": false}, "picker": {"editor": "boolean", "default": false}, "desk": {"editor": "boolean", "default": false}, "rulesAll": {"editor": "boolean", "default": true}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sync: props.minioff ? 'offline' : 'idle', theme: 'System', cap: 200, picker: props.picker ? 'Shopping' : '', cats: {} };
  }
  renderVals() {
    const L = { paper: '#F6F4EE', card: '#FBFAF6', sunken: '#EEEBE2', rule: '#D9D5C8', hair: '#E2DED3', field: '#8A8576', input: '#FFFFFF', track: '#E6E2D7', raised: '#FBFAF6', ink: '#1C2230', ink2: '#4A5163', ink3: '#5E6272', brand: '#2F4A7A', 'on-brand': '#FFFFFF', 'brand-soft': '#E3E8F1', earn: '#2D6B4A', 'earn-soft': '#E2EFE6', over: '#A3402D', 'over-soft': '#F6E3DE', 'on-over': '#FFFFFF', watch: '#8A5A12', 'watch-text': '#7A4F0E', 'watch-soft': '#F4E9D2', btn: '#1C2230', 'on-btn': '#F6F4EE', hero: '#1C2230', 'on-hero': '#F6F4EE', 'on-hero-2': '#A9AEBB', 'on-hero-gain': '#8FD1A8', 'on-hero-month': '#F2C879', 'on-hero-pace': '#8FA6CF', 'on-hero-over': '#F2A08C', 'on-cat': '#FFFFFF', 'ai-1': '#2F4A7A', 'ai-2': '#5B3FC4', 'ai-3': '#8A3FA8', 'ai-text': '#5B3FC4', 'ai-glow': 'rgba(91,63,196,0.38)', 'ai-soft': 'rgba(91,63,196,0.08)', scrim: 'rgba(28,34,48,0.45)', shadow: 'rgba(28,34,48,0.14)', focus: '#2F4A7A',
      'c-food': '#B4572E', 'c-shopping': '#6B4C8A', 'c-transport': '#2F6F8F', 'c-utilities': '#8A6A1F', 'c-entertainment': '#9B3D5C', 'c-home': '#4F7A4A', 'c-health': '#3D8077', 'c-sports': '#6B7A2A', 'c-work': '#55606E', 'c-other': '#8A8576', 'c-salary': '#2D6B4A', 'c-refunds': '#1F7A63', 'c-interest': '#4B7432', 'c-other-income': '#8A8576' };
    const D = { paper: '#12151C', card: '#191D26', sunken: '#222733', rule: '#323848', hair: '#282E3B', field: '#737A8C', input: '#12151C', track: '#2A303D', raised: '#363D4D', ink: '#ECE8DF', ink2: '#BFC2CC', ink3: '#A0A4B0', brand: '#9DB3DA', 'on-brand': '#12151C', 'brand-soft': '#243149', earn: '#74C595', 'earn-soft': '#1D3326', over: '#F08C76', 'over-soft': '#3A1F1A', 'on-over': '#12151C', watch: '#C99A3A', 'watch-text': '#E6B864', 'watch-soft': '#3A2F18', btn: '#ECE8DF', 'on-btn': '#12151C', hero: '#232937', 'on-hero': '#ECE8DF', 'on-hero-2': '#A9AEBB', 'on-hero-gain': '#8FD1A8', 'on-hero-month': '#F2C879', 'on-hero-pace': '#8FA6CF', 'on-hero-over': '#F2A08C', 'on-cat': '#12151C', 'ai-1': '#8FA6D8', 'ai-2': '#A58CF2', 'ai-3': '#D08AE6', 'ai-text': '#B9A6F7', 'ai-glow': 'rgba(150,120,255,0.42)', 'ai-soft': 'rgba(165,140,242,0.12)', scrim: 'rgba(0,0,0,0.6)', shadow: 'rgba(0,0,0,0.5)', focus: '#9DB3DA',
      'c-food': '#E08A60', 'c-shopping': '#B497D6', 'c-transport': '#66AFD0', 'c-utilities': '#D2AE55', 'c-entertainment': '#DB86A2', 'c-home': '#8CC487', 'c-health': '#63BFB1', 'c-sports': '#B2C46A', 'c-work': '#A3ACBC', 'c-other': '#8F8B80', 'c-salary': '#74C595', 'c-refunds': '#5FC4A6', 'c-interest': '#A4C97E', 'c-other-income': '#8F8B80' };
    const T = this.props.dark ? D : L;
    const vars = Object.keys(T).map((k) => '--' + k + ': ' + T[k] + ';').join(' ');
    const col = (c) => 'var(--c-' + c.toLowerCase().replace(/ /g, '-') + ')';

    const s = this.state, p = this.props;
    const seg = (label, on, fn) => ({ label, on: on ? 'true' : 'false', fn, bg: on ? 'var(--raised)' : 'transparent', fg: on ? 'var(--ink)' : 'var(--ink2)', shadow: on ? '0 1px 2px var(--shadow)' : 'none' });
    const SW = [['Clay', 'Food'], ['Plum', 'Shopping'], ['Steel blue', 'Transport'], ['Ochre', 'Utilities'], ['Rose', 'Entertainment'], ['Leaf', 'Home'], ['Teal', 'Health'], ['Olive', 'Sports'], ['Slate', 'Work'], ['Stone', 'Other'], ['Green', 'Salary'], ['Pine', 'Refunds'], ['Moss', 'Interest']];
    const cats = s.cats;
    const G = [['Spending', ['Food', 'Shopping', 'Transport', 'Utilities', 'Entertainment', 'Home', 'Health', 'Sports', 'Work', 'Other']], ['Income', ['Salary', 'Refunds', 'Interest', 'Other income']]];
    const COUNT = { Food: 412, Shopping: 96, Transport: 141, Utilities: 58, Entertainment: 73, Home: 31, Health: 22, Sports: 9, Work: 64, Other: 388, Salary: 18, Refunds: 27, Interest: 12, 'Other income': 4 };
    const fixed = (n) => n === 'Other' || n === 'Other income';
    const openCat = s.picker;
    const SYNC = {
      idle: { label: 'Sync now', msg: '', tone: 'var(--ink2)', weight: '400', spin: false, busy: 'false', op: '1' },
      requested: { label: 'Requested', msg: 'Asked the mini to check for new SMS.', tone: 'var(--ink2)', weight: '400', spin: true, busy: 'true', op: '0.6' },
      waiting: { label: 'Waiting', msg: 'Waiting for the mini. Usually under a minute.', tone: 'var(--ink2)', weight: '400', spin: true, busy: 'true', op: '0.6' },
      synced: { label: 'Sync now', msg: 'Synced · 3 new transactions', tone: 'var(--earn)', weight: '600', spin: false, busy: 'false', op: '1' },
      offline: { label: 'Sync now', msg: 'The mini is offline. Sync runs when it’s back.', tone: 'var(--watch-text)', weight: '500', spin: false, busy: 'false', op: '1' }
    };
    const order = ['idle', 'requested', 'waiting', 'synced'];
    const swatches = SW.map(([name, key]) => { const on = openCat && (cats[openCat] || openCat) === key; return { name, color: col(key), on: on ? 'true' : 'false', tick: on, ring: on ? '0 0 0 2px var(--card), 0 0 0 4px var(--ink)' : 'none', fn: () => this.setState({ cats: Object.assign({}, cats, { [openCat]: key }) }) }; });
    const sync = Object.assign({}, SYNC[s.sync], { fn: () => this.setState({ sync: p.minioff ? 'offline' : order[(order.indexOf(s.sync) + 1) % order.length] }) });
    return {
      vars,
      catHref: p.desk ? 'DeskSetCategories.dc.html' : 'SetCategories.dc.html', rulesHref: p.desk ? 'DeskSetRules.dc.html' : 'SetRules.dc.html',
      mini: p.minioff ? { dot: 'var(--over)', line: 'Offline since 6:10 PM' } : { dot: 'var(--earn)', line: 'Online · checked 3 min ago' },
      sync,
      installed: !p.notinstalled, notInstalled: !!p.notinstalled,
      theme: ['Light', 'Dark', 'System'].map((t) => seg(t, s.theme === t, () => this.setState({ theme: t }))),
      aiOn: !p.aioff, aiOff: !!p.aioff,
      models: [{ id: 'm-text', label: 'Text model', name: 'Gemini 3.5 Flash', meta: 'Google · about ₹0.03 a call' }, { id: 'm-vision', label: 'Vision model, for receipts', name: 'GPT-5 mini', meta: 'OpenAI · about ₹0.20 a receipt' }],
      caps: [50, 100, 200, 500].map((c) => seg(String(c), s.cap === c, () => this.setState({ cap: c }))),
      cap: String(s.cap), used: '12', usedW: (12 / s.cap * 100).toFixed(1) + '%',
      groups: G.map(([name, list]) => ({ name, items: list.map((n) => ({
        name: n, color: col(cats[n] || n), count: COUNT[n] + ' transactions', open: openCat === n,
        ring: openCat === n ? '0 0 0 2px var(--card), 0 0 0 4px var(--ink)' : 'none',
        pick: () => this.setState({ picker: openCat === n ? '' : n }),
        swLabel: 'Colour for ' + n, nameLabel: 'Name for ' + n, dragLabel: 'Reorder ' + n, pickerLabel: 'Colours for ' + n,
        delLabel: 'Delete ' + n, delHref: 'SetCatDelete.dc.html', delShow: fixed(n) ? 'hidden' : 'visible', swatches
      })) })),
      rules: [{ match: 'SWIGGY INSTAMART*', name: 'Swiggy Instamart', cat: 'Food' }, { match: 'FLIPKAR*', name: 'Flipkart', cat: 'Shopping' }, { match: 'IBIBO GROUP', name: 'Goibibo', cat: 'Transport' }, { match: 'BLINKIT', name: 'Blinkit', cat: 'Utilities' }, { match: 'OPENROUTER*', name: 'Openrouter', cat: 'Work' }, { match: 'AMAZON INDIA', name: 'Amazon', cat: 'Shopping' }, { match: 'HOSTINGER*', name: 'Hostinger', cat: 'Work' }, { match: 'NETFLIX.COM', name: 'Netflix', cat: 'Entertainment' }].slice(0, p.rulesAll ? 8 : 3).map((r) => Object.assign({}, r, { color: col(r.cat), edit: 'Edit rule for ' + r.name }))
    };
  }
}
</script>
</body>
</html>
