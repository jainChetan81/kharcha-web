<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Activity with splits</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input,textarea{font:inherit}
</style>
</helmet>
<div style="{{vars}} width: 390px; height: 860px; position: relative; overflow: hidden; background: var(--paper); color: var(--ink); font-family: 'IBM Plex Sans', system-ui, sans-serif; font-variant-numeric: tabular-nums lining-nums">

  <header style="padding: 20px 20px 12px"><h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 26px">Activity</h1></header>

  <div role="radiogroup" aria-label="Category filter" style="padding: 0 20px; display: flex; gap: 8px; flex-wrap: wrap">
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
      <button type="button" role="radio" aria-checked="{{c.on}}" onClick="{{c.pick}}" style="min-height: 44px; padding: 0 12px; border-radius: 999px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font-size: 14px; display: flex; align-items: center; gap: 6px; cursor: pointer"><span style="width: 8px; height: 8px; border-radius: 2px; background: {{c.color}}; display: {{c.dot}}"></span>{{c.name}}</button>
    </sc-for>
  </div>

  <div style="margin: 12px 20px 0; display: flex; justify-content: space-between; padding: 10px 12px; border-radius: 10px; background: var(--sunken); font-size: 13px; color: var(--ink2)">
    <span>{{sumLabel}}</span><strong style="color: var(--ink); font-weight: 600">{{sum}}</strong>
  </div>

  <section style="padding: 8px 20px 0">
    <div style="display: flex; justify-content: space-between; padding: 14px 0 6px; border-bottom: 1px solid var(--ink); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink2)"><span>Sat 17 Oct</span><span style="color: var(--ink); font-weight: 600">{{dayTotal}}</span></div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
      <a href="RcSaved.dc.html" style="display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--hair); color: var(--ink); text-decoration: none">
        <span style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
          <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 15px; font-weight: 500">{{r.m}}</span><span style="font-size: 13px; color: var(--ink3)">{{r.meta}}</span></span>
          <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px"><span style="font-size: 15px; font-weight: 500">{{r.a}}</span><span style="font-size: 12px; color: var(--ink3)">{{r.of}}</span></span>
        </span>
        <sc-if value="{{r.isSplit}}" hint-placeholder-val="{{ false }}">
          <span aria-hidden="true" style="display: flex; height: 4px; gap: 1px; border-radius: 2px; overflow: hidden; opacity: {{r.barOpacity}}">
            <span style="flex: 1180; background: var(--c-food)"></span><span style="flex: 890; background: var(--c-shopping)"></span><span style="flex: 210; background: var(--c-health)"></span><span style="flex: 60; background: var(--c-other)"></span>
          </span>
        </sc-if>
      </a>
    </sc-for>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":860}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { f: 'Health' };
  }
  renderVals() {
    const L = { paper: '#F6F4EE', card: '#FBFAF6', sunken: '#EEEBE2', rule: '#D9D5C8', hair: '#E2DED3', field: '#8A8576', input: '#FFFFFF', ink: '#1C2230', ink2: '#4A5163', ink3: '#5E6272', brand: '#2F4A7A', 'on-brand': '#FFFFFF',
      'c-food': '#B4572E', 'c-shopping': '#6B4C8A', 'c-health': '#3D8077', 'c-other': '#8A8576' };
    const D = { paper: '#12151C', card: '#191D26', sunken: '#222733', rule: '#323848', hair: '#282E3B', field: '#737A8C', input: '#12151C', ink: '#ECE8DF', ink2: '#BFC2CC', ink3: '#A0A4B0', brand: '#9DB3DA', 'on-brand': '#12151C',
      'c-food': '#E08A60', 'c-shopping': '#B497D6', 'c-health': '#63BFB1', 'c-other': '#8F8B80' };
    const t = this.props.dark ? D : L;
    const f = this.state.f;
    const part = { All: 2340, Food: 1180, Shopping: 890, Health: 210 };
    const fmt = (x) => '₹' + x.toLocaleString('en-IN');
    const others = {
      All: [{ m: 'Apollo Pharmacy', meta: '11:20 AM · Health · ••0532', a: '₹460' }, { m: 'Croma', meta: '4:05 PM · Shopping · ••3266', a: '₹1,999' }],
      Food: [{ m: 'Swish', meta: '1:10 PM · Food · ••0532', a: '₹321' }],
      Shopping: [{ m: 'Croma', meta: '4:05 PM · Shopping · ••3266', a: '₹1,999' }],
      Health: [{ m: 'Apollo Pharmacy', meta: '11:20 AM · Health · ••0532', a: '₹460' }]
    }[f];
    const split = { m: 'Swiggy Instamart', meta: '7:42 PM · ' + (f === 'All' ? 'Split in 4' : f + ' part of a split') + ' · ••2047', a: fmt(part[f]), of: f === 'All' ? '' : 'of ₹2,340', isSplit: true, barOpacity: '1' };
    const rows = [split].concat(others.map((o) => Object.assign({ of: '', isSplit: false, barOpacity: '1' }, o)));
    const total = rows.reduce((s, r) => s + parseInt(r.a.replace(/[₹,]/g, ''), 10), 0);
    return {
      vars: Object.keys(t).map((k) => '--' + k + ': ' + t[k] + ';').join(' '),
      chips: ['All', 'Food', 'Shopping', 'Health'].map((c) => {
        const on = c === f;
        return { name: c, on, color: c === 'All' ? 'transparent' : 'var(--c-' + c.toLowerCase() + ')', dot: c === 'All' ? 'none' : 'inline-block', bg: on ? 'var(--brand)' : 'var(--input)', fg: on ? 'var(--on-brand)' : 'var(--ink)', border: on ? 'var(--brand)' : 'var(--field)', pick: () => this.setState({ f: c }) };
      }),
      rows,
      dayTotal: fmt(total),
      sumLabel: f === 'All' ? 'October · all' : 'October · ' + f + ', counting only the ' + f + ' part of splits',
      sum: fmt(total)
    };
  }
}
</script>
</body>
</html>
