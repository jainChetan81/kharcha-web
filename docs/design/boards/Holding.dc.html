<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add holding</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F4EE}
a{color:#2F4A7A}a:hover{color:#1F3459}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 1380px; position: relative; overflow: hidden; background: #F6F4EE; color: #1C2230; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-variant-numeric: tabular-nums lining-nums">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 8px 8px">
    <div style="display: flex; align-items: center">
      <a href="Wealth.dc.html" aria-label="Back to wealth" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1C2230"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
      <h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 24px">Add holding</h1>
    </div>
  </header>

  <div role="radiogroup" aria-label="Kind" style="margin: 8px 20px 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: #EEEBE2">
    <sc-for list="{{kinds}}" as="k" hint-placeholder-count="4">
      <button type="button" role="radio" aria-checked="{{k.on}}" onClick="{{k.pick}}" style="min-height: 40px; border-radius: 9px; border: 0; font-size: 14px; font-weight: 500; background: {{k.bg}}; color: {{k.fg}}; box-shadow: {{k.shadow}}">{{k.name}}</button>
    </sc-for>
  </div>

  <sc-if value="{{coded}}" hint-placeholder-val="{{ true }}">
    <section style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 10px">
      <label style="display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 12px; border-radius: 10px; border: 1px solid #8A8576; background: #FFFFFF">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E6272" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search funds</span>
        <input value="{{query}}" style="flex: 1; border: 0; outline: none; background: transparent; font: inherit; font-size: 16px; color: #1C2230">
      </label>
      <div role="listbox" aria-label="Matching schemes" style="display: flex; flex-direction: column; border-top: 1px solid #E2DED3">
        <sc-for list="{{results}}" as="r" hint-placeholder-count="3">
          <button type="button" role="option" aria-selected="{{r.on}}" onClick="{{r.pick}}" style="min-height: 60px; border: 0; border-bottom: 1px solid #E2DED3; padding: 8px 10px; text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 10px; background: {{r.bg}}; color: #1C2230">
            <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">{{r.name}}</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #4A5163">AMFI {{r.code}} · NAV ₹{{r.nav}}</span></span>
            <sc-if value="{{r.on}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2F4A7A" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></sc-if>
          </button>
        </sc-for>
      </div>
    </section>
  </sc-if>

  <sc-if value="{{manual}}" hint-placeholder-val="{{ false }}">
    <section style="padding: 20px 20px 0; display: grid; grid-template-columns: minmax(0, 1fr) 140px; gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="hd-name" style="font-size: 13px; color: #4A5163">Name</label>
        <input id="hd-name" value="{{manualName}}" style="min-height: 48px; padding: 0 12px; border-radius: 10px; border: 1px solid #8A8576; background: #FFFFFF; font: inherit; font-size: 16px; color: #1C2230">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="hd-val" style="font-size: 13px; color: #4A5163">Value today</label>
        <input id="hd-val" value="{{manualVal}}" style="min-height: 48px; padding: 0 12px; border-radius: 10px; border: 1px solid #8A8576; background: #FFFFFF; font: inherit; font-size: 16px; color: #1C2230; text-align: right">
      </div>
    </section>
  </sc-if>

  <section style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <h2 style="margin: 0; padding-bottom: 8px; border-bottom: 1px solid #1C2230; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #5E6272">SIP</h2>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="hd-amt" style="font-size: 13px; color: #4A5163">Amount</label>
        <input id="hd-amt" value="₹10,000" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #8A8576; background: #FFFFFF; font: inherit; font-size: 16px; color: #1C2230">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="hd-day" style="font-size: 13px; color: #4A5163">Day of month</label>
        <input id="hd-day" value="20" inputmode="numeric" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #8A8576; background: #FFFFFF; font: inherit; font-size: 16px; color: #1C2230">
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="hd-match" style="font-size: 13px; color: #4A5163">Match SMS debits containing</label>
      <input id="hd-match" value="NIFTY 50 IDX" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #8A8576; background: #FFFFFF; font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #1C2230">
      <span style="font-size: 13px; color: #2D6B4A; font-weight: 500">31 past debits match. They become instalments.</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="hd-target" style="font-size: 13px; color: #4A5163">Target share of portfolio</label>
      <input id="hd-target" value="40%" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #8A8576; background: #FFFFFF; font: inherit; font-size: 16px; color: #1C2230">
    </div>
  </section>

  <section style="margin: 24px 20px 0; padding: 16px; border-radius: 12px; border: 1px dashed #8A8576; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-size: 15px; font-weight: 600">Import history from CSV</span>
      <button type="button" style="min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #1C2230; background: transparent; color: #1C2230; font-size: 14px; font-weight: 500">Choose file</button>
    </div>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #3E4352">date, fund, amount, units, nav</span>
    <div style="display: flex; flex-direction: column; border-top: 1px solid #E2DED3; font-size: 13px">
      <sc-for list="{{preview}}" as="p" hint-placeholder-count="3">
        <div style="display: grid; grid-template-columns: 62px minmax(0, 1fr) 64px 58px; gap: 8px; min-height: 36px; align-items: center; border-bottom: 1px solid #E2DED3"><span style="color: #4A5163">{{p.d}}</span><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.f}}</span><span style="text-align: right; font-weight: 500">{{p.a}}</span><span style="text-align: right">{{p.u}}</span></div>
      </sc-for>
    </div>
    <span style="font-size: 13px; color: #1C2230"><strong style="font-weight: 600">96 rows</strong> read · 3 funds · 0 errors</span>
  </section>

  <div style="padding: 24px 20px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
    <a href="Wealth.dc.html" style="min-height: 52px; border-radius: 12px; border: 1px solid #1C2230; display: flex; align-items: center; justify-content: center; color: #1C2230; font-size: 15px; font-weight: 500; text-decoration: none">Cancel</a>
    <a href="Wealth.dc.html" style="grid-column: span 2; min-height: 52px; border-radius: 12px; background: #1C2230; display: flex; align-items: center; justify-content: center; color: #F6F4EE; font-size: 15px; font-weight: 500; text-decoration: none">Save holding</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1380}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { kind: 'Fund', sel: 0 };
  }
  renderVals() {
    const s = this.state;
    const kinds = ['Fund', 'NPS', 'Gold', 'Other'].map((k) => {
      const on = k === s.kind;
      return { name: k, on, bg: on ? '#FBFAF6' : 'transparent', fg: on ? '#1C2230' : '#4A5163', shadow: on ? '0 1px 2px rgba(28,34,48,0.12)' : 'none', pick: () => this.setState({ kind: k, sel: 0 }) };
    });
    const lists = {
      Fund: { q: 'nifty 50 index direct', r: [['Nifty 50 Index · Direct Growth', '1•••16', '194.54'], ['Nifty 50 Index · Direct IDCW', '1•••17', '41.08'], ['Nifty 50 Equal Weight · Direct', '1•••42', '17.33']] },
      Gold: { q: 'gold fund direct', r: [['Gold Fund of Fund · Direct Growth', '1•••88', '31.62'], ['Gold ETF', '1•••05', '82.10']] }
    };
    const L = lists[s.kind];
    return {
      kinds,
      coded: s.kind === 'Fund' || s.kind === 'Gold',
      manual: s.kind === 'NPS' || s.kind === 'Other',
      manualName: s.kind === 'NPS' ? 'NPS Tier I · Scheme E' : 'Fixed deposit, HDFC',
      manualVal: s.kind === 'NPS' ? '₹91,600' : '₹1,00,000',
      query: L ? L.q : '',
      results: L ? L.r.map(([name, code, nav], i) => ({ name, code, nav, on: i === s.sel, bg: i === s.sel ? '#E3E8F1' : 'transparent', pick: () => this.setState({ sel: i }) })) : [],
      preview: [
        { d: '20 Sept 26', f: 'Nifty 50 Index', a: '₹10,000', u: '51.20' },
        { d: '05 Sept 26', f: 'Nifty Next 50 Index', a: '₹5,000', u: '78.41' },
        { d: '25 Aug 26', f: 'Gold FoF', a: '₹2,000', u: '64.03' }
      ]
    };
  }
}
</script>
</body>
</html>
