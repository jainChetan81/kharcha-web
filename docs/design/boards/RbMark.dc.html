<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mark reimbursable</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input,textarea{font:inherit}
</style>
</helmet>
<div style="{{vars}} width: 390px; height: 960px; position: relative; overflow: hidden; background: var(--paper); color: var(--ink); font-family: 'IBM Plex Sans', system-ui, sans-serif; font-variant-numeric: tabular-nums lining-nums">

  <div style="padding: 20px; display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink3)">Sat 10 Oct · ••3266</span>
    <span style="font-family: 'Newsreader', Georgia, serif; font-size: 26px">Toit, Indiranagar</span>
  </div>
  <div style="position: absolute; inset: 0; background: var(--scrim)"></div>

  <section role="dialog" aria-labelledby="rb-title" style="position: absolute; left: 0; right: 0; bottom: 0; top: 70px; background: var(--card); border-radius: 20px 20px 0 0; padding: 8px 20px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
    <div style="width: 36px; height: 4px; border-radius: 2px; background: var(--rule); align-self: center"></div>
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <h2 id="rb-title" style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 24px">Reimbursable</h2>
      <span style="font-size: 14px; color: var(--ink2)">of ₹3,000</span>
    </div>

    <div role="radiogroup" aria-label="How much" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: var(--sunken)">
      <sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
        <button type="button" role="radio" aria-checked="{{m.on}}" onClick="{{m.pick}}" disabled="{{m.off}}" style="min-height: 40px; border-radius: 9px; border: 0; font-size: 14px; font-weight: 500; background: {{m.bg}}; color: {{m.fg}}; cursor: pointer">{{m.name}}</button>
      </sc-for>
    </div>

    <sc-if value="{{isPart}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="rb-amt" style="font-size: 13px; color: var(--ink2)">Amount coming back</label>
        <input id="rb-amt" value="₹1,200" inputmode="decimal" style="min-height: 52px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--field); background: var(--input); color: var(--ink); font-family: 'Newsreader', Georgia, serif; font-size: 24px">
        <div style="display: flex; gap: 8px">
          <button type="button" style="min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--field); background: var(--input); color: var(--ink); font-size: 13px; cursor: pointer">Half · ₹1,500</button>
          <button type="button" style="min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--field); background: var(--input); color: var(--ink); font-size: 13px; cursor: pointer">Split 5 ways · ₹600 each</button>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{isItems}}" hint-placeholder-val="{{ false }}">
      <a href="RbItems.dc.html" style="min-height: 52px; padding: 0 14px; border-radius: 12px; border: 1px dashed var(--field); display: flex; align-items: center; justify-content: space-between; color: var(--ink); text-decoration: none; font-size: 15px"><span>Pick items from the receipt</span><span style="color: var(--brand); font-weight: 600">Choose</span></a>
    </sc-if>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; color: var(--ink2)">Who pays it back</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{people}}" as="p" hint-placeholder-count="4">
          <button type="button" aria-pressed="{{p.on}}" onClick="{{p.pick}}" style="min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid {{p.border}}; background: {{p.bg}}; color: {{p.fg}}; font-size: 14px; cursor: pointer">{{p.name}}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="rb-note" style="font-size: 13px; color: var(--ink2)">Note</label>
      <input id="rb-note" value="Team dinner · expense claim" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--field); background: var(--input); color: var(--ink); font-size: 16px">
    </div>

    <dl style="margin: 0; padding: 12px 14px; border-radius: 12px; background: var(--sunken); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; font-size: 14px">
      <dt style="color: var(--ink2)">Paid</dt><dd style="margin: 0; text-align: right">₹3,000</dd>
      <dt style="color: var(--ink2)">Back from {{who}}</dt><dd style="margin: 0; text-align: right">{{back}}</dd>
      <dt style="font-weight: 600; border-top: 1px solid var(--ink); padding-top: 6px">Yours, counted in budgets</dt><dd style="margin: 0; text-align: right; font-weight: 600; border-top: 1px solid var(--ink); padding-top: 6px">{{yours}}</dd>
    </dl>

    <div style="margin-top: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
      <button type="button" style="min-height: 52px; border-radius: 12px; border: 1px solid var(--ink); background: transparent; color: var(--ink); font-size: 15px; font-weight: 500; cursor: pointer">Cancel</button>
      <a href="RbStatus.dc.html" style="grid-column: span 2; min-height: 52px; border-radius: 12px; background: var(--btn); display: flex; align-items: center; justify-content: center; color: var(--on-btn); font-size: 15px; font-weight: 500; text-decoration: none">Mark reimbursable</a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'Part', who: 'Office' };
  }
  renderVals() {
    const L = { paper: '#F6F4EE', card: '#FBFAF6', sunken: '#EEEBE2', rule: '#D9D5C8', hair: '#E2DED3', field: '#8A8576', input: '#FFFFFF', ink: '#1C2230', ink2: '#4A5163', ink3: '#5E6272', brand: '#2F4A7A', 'on-brand': '#FFFFFF', btn: '#1C2230', 'on-btn': '#F6F4EE', scrim: 'rgba(28,34,48,0.45)', tab: '#FBFAF6' };
    const D = { paper: '#12151C', card: '#191D26', sunken: '#222733', rule: '#323848', hair: '#282E3B', field: '#737A8C', input: '#12151C', ink: '#ECE8DF', ink2: '#BFC2CC', ink3: '#A0A4B0', brand: '#9DB3DA', 'on-brand': '#12151C', btn: '#ECE8DF', 'on-btn': '#12151C', scrim: 'rgba(0,0,0,0.6)', tab: '#191D26' };
    const t = this.props.dark ? D : L;
    const s = this.state;
    const back = s.mode === 'Full' ? 3000 : s.mode === 'Part' ? 1200 : 1000;
    const fmt = (x) => '₹' + x.toLocaleString('en-IN');
    return {
      vars: Object.keys(t).map((k) => '--' + k + ': ' + t[k] + ';').join(' '),
      modes: ['Full', 'Part', 'Items'].map((m) => ({ name: m, on: m === s.mode, off: m === 'Items', bg: m === s.mode ? 'var(--tab)' : 'transparent', fg: m === s.mode ? 'var(--ink)' : m === 'Items' ? 'var(--ink3)' : 'var(--ink2)', pick: () => { if (m !== 'Items') this.setState({ mode: m }); } })),
      isPart: s.mode === 'Part',
      isItems: s.mode === 'Items',
      people: ['Office', 'Rohan', 'Priya', 'Someone else'].map((p) => {
        const on = p === s.who;
        return { name: p, on, bg: on ? 'var(--brand)' : 'var(--input)', fg: on ? 'var(--on-brand)' : 'var(--ink)', border: on ? 'var(--brand)' : 'var(--field)', pick: () => this.setState({ who: p }) };
      }),
      who: s.who === 'Someone else' ? 'them' : s.who,
      back: fmt(back),
      yours: fmt(3000 - back)
    };
  }
}
</script>
</body>
</html>
