<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reimbursement status</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input,textarea{font:inherit}
</style>
</helmet>
<div style="{{vars}} width: 390px; height: 1240px; position: relative; overflow: hidden; background: var(--paper); color: var(--ink); font-family: 'IBM Plex Sans', system-ui, sans-serif; font-variant-numeric: tabular-nums lining-nums">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 12px 8px 8px">
    <a href="RbList.dc.html" aria-label="Back to reimbursements" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--ink)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
    <a href="RbMark.dc.html" style="min-height: 44px; padding: 0 12px; display: flex; align-items: center; color: var(--brand); font-size: 15px; font-weight: 500; text-decoration: none">Edit</a>
  </header>

  <section style="margin: 0 20px; padding: 4px 0 18px; border-bottom: 3px double var(--ink); display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink3)">Expense · Food · Sat 10 Oct</span>
    <h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 30px">Toit, Indiranagar</h1>
    <div style="display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap">
      <span style="font-family: 'Newsreader', Georgia, serif; font-size: 44px; line-height: 1; font-weight: 500"><span style="font-size: 24px; color: var(--ink3)">₹</span>3,000</span>
      <span style="font-size: 15px; color: var(--ink2)">paid · <strong style="color: var(--ink); font-weight: 600">₹1,800 yours</strong></span>
    </div>
  </section>

  <section style="margin: 18px 20px 0; padding: 16px; border-radius: 12px; background: var(--card); border: 1px solid var(--rule); display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></svg>₹1,200 from Office</span>
      <span style="padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: {{tagBg}}; color: {{tagFg}}">{{tag}}</span>
    </div>
    <div style="height: 8px; border-radius: 4px; background: var(--sunken)"><div style="height: 8px; border-radius: 4px; width: {{pct}}; background: var(--earn)"></div></div>
    <div style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: var(--ink2)">{{gotLabel}}</span><span style="font-weight: 600">{{leftLabel}}</span></div>
    <span style="font-size: 13px; color: var(--ink3)">Team dinner · expense claim</span>
  </section>

  <section style="padding: 22px 20px 0">
    <h2 style="margin: 0; padding-bottom: 8px; border-bottom: 1px solid var(--ink); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink3)">Repayments</h2>
    <sc-for list="{{linked}}" as="l" hint-placeholder-count="1">
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) auto 44px; gap: 8px; align-items: center; min-height: 56px; border-bottom: 1px solid var(--hair)">
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">{{l.name}}</span><span style="font-size: 13px; color: var(--ink3)">{{l.meta}}</span></span>
        <span style="font-size: 15px; font-weight: 500; color: var(--earn)">{{l.amt}}</span>
        <button type="button" onClick="{{l.unlink}}" aria-label="{{l.unlinkLabel}}" style="width: 44px; height: 44px; border: 0; background: transparent; color: var(--ink3); cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
    </sc-for>
  </section>

  <sc-if value="{{hasSuggest}}" hint-placeholder-val="{{ true }}">
    <section style="padding: 22px 20px 0">
      <h2 style="margin: 0; padding-bottom: 8px; border-bottom: 1px solid var(--ink); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink3)">Might be the repayment</h2>
      <sc-for list="{{suggest}}" as="s" hint-placeholder-count="2">
        <div style="margin-top: 10px; padding: 12px 14px; border-radius: 12px; border: 1px dashed var(--field); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center">
          <span style="font-size: 15px; font-weight: 500">{{s.name}}</span><span style="font-size: 15px; font-weight: 500; color: var(--earn)">{{s.amt}}</span>
          <span style="font-size: 13px; color: var(--ink2)">{{s.why}}</span>
          <button type="button" onClick="{{s.link}}" style="min-height: 36px; padding: 0 14px; border-radius: 10px; border: 0; background: var(--btn); color: var(--on-btn); font-size: 13px; font-weight: 500; cursor: pointer">Link</button>
        </div>
      </sc-for>
    </section>
  </sc-if>

  <div style="padding: 24px 20px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <button type="button" onClick="{{markAll}}" style="min-height: 48px; border-radius: 12px; border: 1px solid var(--ink); background: transparent; color: var(--ink); font-size: 15px; font-weight: 500; cursor: pointer">Mark fully paid</button>
    <a href="RbCases.dc.html" style="min-height: 48px; border-radius: 12px; border: 1px solid var(--over); display: flex; align-items: center; justify-content: center; color: var(--over); font-size: 15px; font-weight: 500; text-decoration: none">Cancel claim</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { linked: ['a'], manual: false };
  }
  renderVals() {
    const L = { paper: '#F6F4EE', card: '#FBFAF6', sunken: '#EEEBE2', rule: '#D9D5C8', hair: '#E2DED3', field: '#8A8576', input: '#FFFFFF', ink: '#1C2230', ink2: '#4A5163', ink3: '#5E6272', brand: '#2F4A7A', 'brand-soft': '#E3E8F1', earn: '#2D6B4A', 'earn-soft': '#E2EFE6', over: '#A3402D', 'watch-text': '#7A4F0E', 'watch-soft': '#F4E9D2', btn: '#1C2230', 'on-btn': '#F6F4EE' };
    const D = { paper: '#12151C', card: '#191D26', sunken: '#222733', rule: '#323848', hair: '#282E3B', field: '#737A8C', input: '#12151C', ink: '#ECE8DF', ink2: '#BFC2CC', ink3: '#A0A4B0', brand: '#9DB3DA', 'brand-soft': '#243149', earn: '#74C595', 'earn-soft': '#1D3326', over: '#F08C76', 'watch-text': '#E6B864', 'watch-soft': '#3A2F18', btn: '#ECE8DF', 'on-btn': '#12151C' };
    const t = this.props.dark ? D : L;
    const all = {
      a: { name: 'NEFT · ACME TECH PVT LTD', meta: 'Thu 15 Oct · into ••0532', n: 600 },
      b: { name: 'NEFT · ACME TECH PVT LTD', meta: 'Fri 16 Oct · into ••0532', n: 600, why: 'Same sender as the first part. Covers what’s left.' },
      c: { name: 'UPI · ROHAN K', meta: 'Wed 14 Oct · into ••0532', n: 650, why: 'Close in amount and date. Different sender.' }
    };
    const s = this.state;
    const got = s.manual ? 1200 : s.linked.reduce((sum, k) => sum + all[k].n, 0);
    const done = got >= 1200;
    const fmt = (x) => '₹' + x.toLocaleString('en-IN');
    const tag = done ? (got > 1200 ? 'Extra back' : 'Reimbursed') : got > 0 ? 'Partly back' : 'Pending';
    const tagStyle = { 'Pending': ['var(--brand-soft)', 'var(--brand)'], 'Partly back': ['var(--watch-soft)', 'var(--watch-text)'], 'Reimbursed': ['var(--earn-soft)', 'var(--earn)'], 'Extra back': ['var(--earn-soft)', 'var(--earn)'] }[tag];
    return {
      vars: Object.keys(t).map((k) => '--' + k + ': ' + t[k] + ';').join(' '),
      tag, tagBg: tagStyle[0], tagFg: tagStyle[1],
      pct: Math.min(got / 1200 * 100, 100).toFixed(0) + '%',
      gotLabel: fmt(got) + ' back',
      leftLabel: done ? (got > 1200 ? fmt(got - 1200) + ' extra, counted as income' : 'Settled') : fmt(1200 - got) + ' still due',
      linked: s.linked.map((k) => ({ name: all[k].name, meta: all[k].meta, amt: '+' + fmt(all[k].n), unlinkLabel: 'Unlink ' + all[k].name, unlink: () => this.setState({ linked: s.linked.filter((x) => x !== k) }) })),
      hasSuggest: !done,
      suggest: ['b', 'c'].filter((k) => !s.linked.includes(k)).map((k) => ({ name: all[k].name, amt: '+' + fmt(all[k].n), why: all[k].why, link: () => this.setState({ linked: s.linked.concat(k) }) })),
      markAll: () => this.setState({ manual: true })
    };
  }
}
</script>
</body>
</html>
