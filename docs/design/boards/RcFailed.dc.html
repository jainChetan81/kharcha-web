<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Receipt · failed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input,textarea{font:inherit}
</style>
</helmet>
<div style="{{vars}} width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--paper); color: var(--ink); font-family: 'IBM Plex Sans', system-ui, sans-serif; font-variant-numeric: tabular-nums lining-nums; display: flex; flex-direction: column">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 8px 8px">
    <div style="display: flex; align-items: center">
      <a href="RcSaved.dc.html" aria-label="Back to transaction" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--ink)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
      <h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 22px">Receipt</h1>
    </div>
    <span style="font-size: 13px; color: var(--ink3)">Instamart · ₹2,340</span>
  </header>

  <div role="radiogroup" aria-label="Failure reason (prototype)" style="margin: 4px 20px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: var(--sunken)">
    <sc-for list="{{reasons}}" as="r" hint-placeholder-count="3">
      <button type="button" role="radio" aria-checked="{{r.on}}" onClick="{{r.pick}}" style="min-height: 44px; border-radius: 9px; border: 0; font-size: 13px; font-weight: 500; background: {{r.bg}}; color: {{r.fg}}; cursor: pointer">{{r.label}}</button>
    </sc-for>
  </div>

  <section style="padding: 32px 28px 0; display: flex; flex-direction: column; align-items: flex-start; gap: 14px">
    <div style="position: relative; width: 112px; height: 150px; border-radius: 10px; border: 1px solid var(--rule); background: var(--input); padding: 12px 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 7px; filter: {{blur}}">
      <span style="height: 7px; width: 70%; border-radius: 2px; background: var(--ink3)"></span>
      <span style="height: 5px; width: 90%; border-radius: 2px; background: var(--rule)"></span>
      <span style="height: 5px; width: 80%; border-radius: 2px; background: var(--rule)"></span>
      <span style="height: 5px; width: 86%; border-radius: 2px; background: var(--rule)"></span>
      <span style="height: 5px; width: 60%; border-radius: 2px; background: var(--rule)"></span>
    </div>
    <h2 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 26px; line-height: 1.2">{{title}}</h2>
    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: var(--ink2)">{{body}}</p>
  </section>

  <div style="margin-top: auto; padding: 0 20px 28px; display: flex; flex-direction: column; gap: 10px">
    <a href="RcManual.dc.html" style="min-height: 52px; border-radius: 12px; background: var(--btn); display: flex; align-items: center; justify-content: center; color: var(--on-btn); font-size: 15px; font-weight: 500; text-decoration: none">Enter items by hand</a>
    <sc-if value="{{canRetry}}" hint-placeholder-val="{{ true }}">
      <a href="RcCapture.dc.html" style="min-height: 52px; border-radius: 12px; border: 1px solid var(--ink); display: flex; align-items: center; justify-content: center; color: var(--ink); font-size: 15px; font-weight: 500; text-decoration: none">{{retryLabel}}</a>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { r: 0 };
  }
  renderVals() {
    const L = { paper: '#F6F4EE', card: '#FBFAF6', sunken: '#EEEBE2', rule: '#D9D5C8', hair: '#E2DED3', field: '#8A8576', input: '#FFFFFF', ink: '#1C2230', ink2: '#4A5163', ink3: '#5E6272', brand: '#2F4A7A', btn: '#1C2230', 'on-btn': '#F6F4EE', tab: '#FBFAF6' };
    const D = { paper: '#12151C', card: '#191D26', sunken: '#222733', rule: '#323848', hair: '#282E3B', field: '#737A8C', input: '#12151C', ink: '#ECE8DF', ink2: '#BFC2CC', ink3: '#A0A4B0', brand: '#9DB3DA', btn: '#ECE8DF', 'on-btn': '#12151C', tab: '#191D26' };
    const t = this.props.dark ? D : L;
    const R = [
      { label: 'Unreadable', title: 'Couldn’t read this photo.', body: 'It’s too blurry or dark. Try a sharper photo, or a screenshot of the order page.', retry: 'Try another photo', blur: 'blur(2px)', canRetry: true },
      { label: 'Not a bill', title: 'This doesn’t look like a bill.', body: 'No prices or totals were found. Pick the order summary or the invoice instead.', retry: 'Pick another image', blur: 'none', canRetry: true },
      { label: 'AI busy', title: 'Receipt reading is unavailable right now.', body: 'The daily limit is reached or the AI service is down. Your images are saved and you can read them later.', retry: 'Try again later', blur: 'none', canRetry: true }
    ];
    const cur = R[this.state.r];
    return {
      vars: Object.keys(t).map((k) => '--' + k + ': ' + t[k] + ';').join(' '),
      reasons: R.map((x, i) => ({ label: x.label, on: i === this.state.r, bg: i === this.state.r ? 'var(--tab)' : 'transparent', fg: i === this.state.r ? 'var(--ink)' : 'var(--ink2)', pick: () => this.setState({ r: i }) })),
      title: cur.title, body: cur.body, retryLabel: cur.retry, blur: cur.blur, canRetry: cur.canRetry
    };
  }
}
</script>
</body>
</html>
