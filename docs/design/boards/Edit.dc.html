<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit transaction</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F4EE}
a{color:#2F4A7A}a:hover{color:#1F3459}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 940px; position: relative; overflow: hidden; background: #F6F4EE; color: #1C2230; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-variant-numeric: tabular-nums lining-nums">
  <a href="Detail.dc.html" aria-label="Close" style="position: absolute; inset: 0; background: rgba(28,34,48,0.45)"></a>

  <section role="dialog" aria-labelledby="ed-title" style="position: absolute; left: 0; right: 0; bottom: 0; top: 40px; background: #FBFAF6; border-radius: 20px 20px 0 0; padding: 8px 20px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
    <div style="width: 36px; height: 4px; border-radius: 2px; background: #D9D5C8; align-self: center"></div>
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <h2 id="ed-title" style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 24px">Edit transaction</h2>
      <span style="font-size: 13px; color: #5E6272">From SMS · 13 Oct</span>
    </div>

    <div role="radiogroup" aria-label="Type" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: #EEEBE2">
      <sc-for list="{{types}}" as="t" hint-placeholder-count="3">
        <button type="button" role="radio" aria-checked="{{t.on}}" onClick="{{t.pick}}" style="min-height: 40px; border-radius: 9px; border: 0; font-size: 14px; font-weight: 500; background: {{t.bg}}; color: {{t.fg}}; box-shadow: {{t.shadow}}">{{t.name}}</button>
      </sc-for>
    </div>

    <div style="display: grid; grid-template-columns: minmax(0, 1fr) 140px; gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="ed-merchant" style="font-size: 13px; color: #4A5163">Merchant</label>
        <input id="ed-merchant" value="Flipkart" style="min-height: 48px; padding: 0 12px; border-radius: 10px; border: 1px solid #8A8576; background: #FFFFFF; font: inherit; font-size: 16px; color: #1C2230">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="ed-amount" style="font-size: 13px; color: #4A5163">Amount</label>
        <input id="ed-amount" value="₹18,088" inputmode="decimal" style="min-height: 48px; padding: 0 12px; border-radius: 10px; border: 1px solid #8A8576; background: #FFFFFF; font-family: 'Newsreader', Georgia, serif; font-size: 20px; text-align: right; color: #1C2230">
      </div>
    </div>
    <span style="margin-top: -8px; font-size: 13px; color: #4A5163">SMS said “FLIPKAR”. New rows from it use your name.</span>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; color: #4A5163">Category</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="9">
          <button type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="min-height: 38px; padding: 0 12px; border-radius: 999px; font-size: 14px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}">{{c.name}}</button>
        </sc-for>
      </div>
    </div>

    <dl style="margin: 0; display: flex; flex-direction: column; border-top: 1px solid #E2DED3">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
        <div style="display: flex; justify-content: space-between; align-items: center; min-height: 48px; border-bottom: 1px solid #E2DED3; font-size: 15px">
          <dt style="color: #4A5163">{{r.k}}</dt>
          <dd style="margin: 0; display: flex; align-items: center; gap: 6px; font-weight: 500">{{r.v}}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5E6272" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></dd>
        </div>
      </sc-for>
      <label style="display: flex; justify-content: space-between; align-items: center; min-height: 52px; border-bottom: 1px solid #E2DED3; font-size: 15px">
        <span style="color: #4A5163">Not a spend</span>
        <button type="button" role="switch" aria-checked="{{excluded}}" onClick="{{flip}}" style="width: 48px; height: 28px; border-radius: 999px; border: 0; padding: 3px; background: {{track}}; display: flex; justify-content: {{knob}}"><span style="width: 22px; height: 22px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.2)"></span></button>
      </label>
    </dl>

    <div style="margin-top: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
      <button type="button" style="min-height: 52px; border-radius: 12px; border: 1px solid #A3402D; background: transparent; color: #A3402D; font-size: 15px; font-weight: 500">Delete</button>
      <a href="Detail.dc.html" style="grid-column: span 2; min-height: 52px; border-radius: 12px; background: #1C2230; display: flex; align-items: center; justify-content: center; color: #F6F4EE; font-size: 15px; font-weight: 500; text-decoration: none">Save changes</a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":940}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cat: 'Shopping', type: 'Expense', excluded: false };
  }
  renderVals() {
    const s = this.state;
    const cats = ['Food', 'Shopping', 'Transport', 'Utilities', 'Entertainment', 'Home', 'Health', 'Work', 'Other'].map((c) => {
      const on = c === s.cat;
      return { name: c, on, bg: on ? '#2F4A7A' : '#FBFAF6', fg: on ? '#FFFFFF' : '#1C2230', border: on ? '#2F4A7A' : '#8A8576', pick: () => this.setState({ cat: c }) };
    });
    const types = ['Expense', 'Income', 'Investment'].map((t) => {
      const on = t === s.type;
      return { name: t, on, bg: on ? '#FBFAF6' : 'transparent', fg: on ? '#1C2230' : '#4A5163', shadow: on ? '0 1px 2px rgba(28,34,48,0.12)' : 'none', pick: () => this.setState({ type: t }) };
    });
    return {
      cats, types,
      rows: [
        { k: 'Date', v: 'Tue 13 Oct, 4:00 PM' },
        { k: 'Card', v: '••3266' },
        { k: 'Trip', v: 'None' },
        { k: 'Note', v: 'Add' }
      ],
      excluded: s.excluded,
      track: s.excluded ? '#2F4A7A' : '#8A8576',
      knob: s.excluded ? 'flex-end' : 'flex-start',
      flip: () => this.setState({ excluded: !s.excluded })
    };
  }
}
</script>
</body>
</html>
