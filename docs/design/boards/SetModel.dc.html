<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings · model picker</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}

</style>
</helmet>
<div style="{{vars}} position: relative; overflow: hidden; background: var(--paper); color: var(--ink); font-family: 'IBM Plex Sans', system-ui, sans-serif; font-variant-numeric: tabular-nums lining-nums; width: 390px; height: 844px">

  <div aria-hidden="true" style="padding: 16px 20px; display: flex; flex-direction: column; gap: 12px">
    <span style="font-family: 'Newsreader', Georgia, serif; font-size: 26px">Settings</span>
    <span style="height: 44px; border-radius: 10px; border: 1px solid var(--field)"></span>
    <span style="display: flex; gap: 8px"><span style="width: 150px; height: 44px; border-radius: 999px; border: 1px solid var(--field)"></span><span style="width: 90px; height: 44px; border-radius: 999px; border: 1px solid var(--field)"></span><span style="width: 100px; height: 44px; border-radius: 999px; border: 1px solid var(--field)"></span></span>
  </div>
  <div style="position: absolute; inset: 0; background: var(--scrim)"></div>
  <section role="dialog" aria-modal="true" aria-labelledby="mdl-t" style="position: absolute; left: 0; right: 0; bottom: 0; top: 120px; background: var(--card); border-radius: 20px 20px 0 0; display: flex; flex-direction: column; box-shadow: 0 -8px 24px var(--shadow)">
    <div style="width: 36px; height: 4px; border-radius: 2px; background: var(--rule); align-self: center; margin-top: 8px"></div>
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 8px 12px 8px 20px">
      <h2 id="mdl-t" style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 22px">Text model</h2>
      <a href="Settings.dc.html" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--ink)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    </header>
    <div style="padding: 4px 20px 0">
      <label style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--field); background: var(--input)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true" style="color: var(--ink3)"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search models</span>
        <input role="combobox" aria-expanded="true" aria-controls="mdl-list" value="{{q}}" onChange="{{search}}" placeholder="Search models" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 16px; color: var(--ink)">
      </label>
    </div>
    <ul id="mdl-list" role="listbox" aria-labelledby="mdl-t" style="list-style: none; margin: 8px 0 0; padding: 0 20px 34px; display: flex; flex-direction: column">
      <sc-for list="{{models}}" as="m" hint-placeholder-count="5">
        <li role="option" aria-selected="{{m.on}}" style="border-bottom: 1px solid var(--hair)">
          <button type="button" onClick="{{m.fn}}" style="width: 100%; min-height: 64px; border: 0; background: transparent; color: var(--ink); display: grid; grid-template-columns: minmax(0, 1fr) auto 24px; gap: 10px; align-items: center; text-align: left; cursor: pointer">
            <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: {{m.weight}}">{{m.name}}</span><span style="font-size: 13px; color: var(--ink3)">{{m.provider}}</span></span>
            <span style="font-size: 13px; color: var(--ink2)">{{m.cost}}</span>
            <span style="visibility: {{m.tick}}; color: var(--brand); display: flex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span>
          </button>
        </li>
      </sc-for>
      <sc-if value="{{none}}" hint-placeholder-val="{{ false }}"><li style="padding: 20px 0; font-size: 14px; color: var(--ink2)">No preset matches.</li></sc-if>
    </ul>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark": {"editor": "boolean", "default": false}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { q: '', v: 'Gemini 3.5 Flash' };
  }
  renderVals() {
    const L = { paper: '#F6F4EE', card: '#FBFAF6', sunken: '#EEEBE2', rule: '#D9D5C8', hair: '#E2DED3', field: '#8A8576', input: '#FFFFFF', track: '#E6E2D7', raised: '#FBFAF6', ink: '#1C2230', ink2: '#4A5163', ink3: '#5E6272', brand: '#2F4A7A', 'on-brand': '#FFFFFF', 'brand-soft': '#E3E8F1', earn: '#2D6B4A', 'earn-soft': '#E2EFE6', over: '#A3402D', 'over-soft': '#F6E3DE', 'on-over': '#FFFFFF', watch: '#8A5A12', 'watch-text': '#7A4F0E', 'watch-soft': '#F4E9D2', btn: '#1C2230', 'on-btn': '#F6F4EE', hero: '#1C2230', 'on-hero': '#F6F4EE', 'on-hero-2': '#A9AEBB', 'on-hero-gain': '#8FD1A8', 'on-hero-month': '#F2C879', 'on-hero-pace': '#8FA6CF', 'on-hero-over': '#F2A08C', 'on-cat': '#FFFFFF', scrim: 'rgba(28,34,48,0.45)', shadow: 'rgba(28,34,48,0.14)', focus: '#2F4A7A',
      'c-food': '#B4572E', 'c-shopping': '#6B4C8A', 'c-transport': '#2F6F8F', 'c-utilities': '#8A6A1F', 'c-entertainment': '#9B3D5C', 'c-home': '#4F7A4A', 'c-health': '#3D8077', 'c-sports': '#6B7A2A', 'c-work': '#55606E', 'c-other': '#8A8576', 'c-salary': '#2D6B4A', 'c-refunds': '#1F7A63', 'c-interest': '#4B7432', 'c-other-income': '#8A8576' };
    const D = { paper: '#12151C', card: '#191D26', sunken: '#222733', rule: '#323848', hair: '#282E3B', field: '#737A8C', input: '#12151C', track: '#2A303D', raised: '#363D4D', ink: '#ECE8DF', ink2: '#BFC2CC', ink3: '#A0A4B0', brand: '#9DB3DA', 'on-brand': '#12151C', 'brand-soft': '#243149', earn: '#74C595', 'earn-soft': '#1D3326', over: '#F08C76', 'over-soft': '#3A1F1A', 'on-over': '#12151C', watch: '#C99A3A', 'watch-text': '#E6B864', 'watch-soft': '#3A2F18', btn: '#ECE8DF', 'on-btn': '#12151C', hero: '#232937', 'on-hero': '#ECE8DF', 'on-hero-2': '#A9AEBB', 'on-hero-gain': '#8FD1A8', 'on-hero-month': '#F2C879', 'on-hero-pace': '#8FA6CF', 'on-hero-over': '#F2A08C', 'on-cat': '#12151C', scrim: 'rgba(0,0,0,0.6)', shadow: 'rgba(0,0,0,0.5)', focus: '#9DB3DA',
      'c-food': '#E08A60', 'c-shopping': '#B497D6', 'c-transport': '#66AFD0', 'c-utilities': '#D2AE55', 'c-entertainment': '#DB86A2', 'c-home': '#8CC487', 'c-health': '#63BFB1', 'c-sports': '#B2C46A', 'c-work': '#A3ACBC', 'c-other': '#8F8B80', 'c-salary': '#74C595', 'c-refunds': '#5FC4A6', 'c-interest': '#A4C97E', 'c-other-income': '#8F8B80' };
    const T = this.props.dark ? D : L;
    const vars = Object.keys(T).map((k) => '--' + k + ': ' + T[k] + ';').join(' ');
    const col = (c) => 'var(--c-' + c.toLowerCase().replace(/ /g, '-') + ')';

    const s = this.state;
    const M = [['Gemini 3.5 Flash', 'Google', '≈ ₹0.03'], ['GPT-5 mini', 'OpenAI', '≈ ₹0.05'], ['Claude Haiku 4.5', 'Anthropic', '≈ ₹0.12'], ['DeepSeek V3.2', 'DeepSeek', '≈ ₹0.01'], ['Llama 4 Maverick', 'Meta', '≈ ₹0.02']];
    const q = s.q.trim().toLowerCase();
    const list = M.filter(([n, pv]) => !q || (n + ' ' + pv).toLowerCase().indexOf(q) >= 0);
    return {
      vars, q: s.q,
      search: (e) => this.setState({ q: e && e.target ? e.target.value : '' }),
      none: list.length === 0,
      models: list.map(([name, provider, cost]) => ({ name, provider, cost: cost + ' a call', on: s.v === name ? 'true' : 'false', weight: s.v === name ? '600' : '500', tick: s.v === name ? 'visible' : 'hidden', fn: () => this.setState({ v: name }) }))
    };
  }
}
</script>
</body>
</html>
