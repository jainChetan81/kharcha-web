<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Receipt · capture</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input,textarea{font:inherit}
</style>
</helmet>
<div style="{{vars}} width: 390px; height: 900px; position: relative; overflow: hidden; background: var(--paper); color: var(--ink); font-family: 'IBM Plex Sans', system-ui, sans-serif; font-variant-numeric: tabular-nums lining-nums">

  <div style="padding: 20px; display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink3)">Tue 13 Oct · ••2047</span>
    <span style="font-family: 'Newsreader', Georgia, serif; font-size: 26px">Swiggy Instamart</span>
    <span style="font-family: 'Newsreader', Georgia, serif; font-size: 40px; font-weight: 500">₹2,340</span>
  </div>
  <div style="position: absolute; inset: 0; background: var(--scrim)"></div>

  <section role="dialog" aria-labelledby="cap-title" style="position: absolute; left: 0; right: 0; bottom: 0; top: 150px; background: var(--card); border-radius: 20px 20px 0 0; padding: 8px 20px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
    <div style="width: 36px; height: 4px; border-radius: 2px; background: var(--rule); align-self: center"></div>
    <h2 id="cap-title" style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 22px">Add receipt</h2>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{sources}}" as="s" hint-placeholder-count="3">
        <a href="RcCrop.dc.html" style="min-height: 88px; border-radius: 12px; border: 1px solid var(--field); background: var(--input); color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 500; text-decoration: none">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.icon}}"/></svg>{{s.label}}
        </a>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-size: 15px; font-weight: 500">{{countLabel}}</span>
      </div>
      <div style="display: flex; gap: 10px; overflow: hidden">
        <sc-for list="{{shots}}" as="t" hint-placeholder-count="3">
          <figure style="margin: 0; flex: none; width: 92px; display: flex; flex-direction: column; gap: 6px">
            <div role="img" aria-label="{{t.aria}}" style="position: relative; height: 150px; border-radius: 10px; border: 1px solid var(--rule); background: var(--input); padding: 10px 8px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px">
              <span style="height: 7px; width: 70%; border-radius: 2px; background: var(--ink2)"></span>
              <span style="height: 5px; width: 92%; border-radius: 2px; background: var(--rule)"></span>
              <span style="height: 5px; width: 80%; border-radius: 2px; background: var(--rule)"></span>
              <span style="height: 5px; width: 88%; border-radius: 2px; background: var(--rule)"></span>
              <span style="height: 5px; width: 64%; border-radius: 2px; background: var(--rule)"></span>
              <span style="height: 5px; width: 84%; border-radius: 2px; background: var(--rule)"></span>
              <span style="height: 5px; width: 72%; border-radius: 2px; background: var(--rule)"></span>
              <button type="button" onClick="{{t.remove}}" aria-label="{{t.removeLabel}}" style="position: absolute; top: -16px; right: -16px; width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><span style="width: 28px; height: 28px; border-radius: 999px; background: var(--btn); color: var(--on-btn); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></span></button>
            </div>
            <figcaption style="font-size: 12px; color: var(--ink2); text-align: center">{{t.n}} of {{total}}</figcaption>
          </figure>
        </sc-for>
        <button type="button" onClick="{{add}}" style="flex: none; width: 92px; height: 150px; border-radius: 10px; border: 1px dashed var(--field); background: transparent; color: var(--brand); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 500; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add more</button>
      </div>
    </div>

    <p style="margin: 0; font-size: 13px; line-height: 1.5; color: var(--ink2)">Photos go to the AI service only to read the items. Kharcha removes card numbers and UPI IDs from what it saves. Crop out full card numbers before adding a photo.</p>

    <div style="margin-top: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
      <button type="button" style="min-height: 52px; border-radius: 12px; border: 1px solid var(--ink); background: transparent; color: var(--ink); font-size: 15px; font-weight: 500; cursor: pointer">Cancel</button>
      <a href="RcReading.dc.html" style="grid-column: span 2; min-height: 52px; border-radius: 12px; background: var(--btn); color: var(--on-btn); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; text-decoration: none">{{readLabel}}</a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { n: 3 };
  }
  renderVals() {
    const L = { paper: '#F6F4EE', card: '#FBFAF6', sunken: '#EEEBE2', rule: '#D9D5C8', hair: '#E2DED3', field: '#8A8576', input: '#FFFFFF', ink: '#1C2230', ink2: '#4A5163', ink3: '#5E6272', brand: '#2F4A7A', 'on-brand': '#FFFFFF', 'brand-soft': '#E3E8F1', earn: '#2D6B4A', over: '#A3402D', watch: '#8A5A12', 'watch-text': '#7A4F0E', 'watch-soft': '#F4E9D2', btn: '#1C2230', 'on-btn': '#F6F4EE', scrim: 'rgba(28,34,48,0.45)' };
    const D = { paper: '#12151C', card: '#191D26', sunken: '#222733', rule: '#323848', hair: '#282E3B', field: '#737A8C', input: '#12151C', ink: '#ECE8DF', ink2: '#BFC2CC', ink3: '#A0A4B0', brand: '#9DB3DA', 'on-brand': '#12151C', 'brand-soft': '#243149', earn: '#74C595', over: '#F08C76', watch: '#C99A3A', 'watch-text': '#E6B864', 'watch-soft': '#3A2F18', btn: '#ECE8DF', 'on-btn': '#12151C', scrim: 'rgba(0,0,0,0.6)' };
    const t = this.props.dark ? D : L;
    const n = this.state.n;
    return {
      vars: Object.keys(t).map((k) => '--' + k + ': ' + t[k] + ';').join(' '),
      sources: [
        { label: 'Camera', icon: 'M4 8h3l2-3h6l2 3h3v11H4zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z' },
        { label: 'Gallery', icon: 'M4 5h16v14H4zM4 15l4-4 4 4 3-3 5 5M15 9.5a1 1 0 1 0 0-.01' },
        { label: 'Files', icon: 'M7 3h7l5 5v13H7zM14 3v5h5' }
      ],
      shots: Array.from({ length: n }, (_, i) => ({ n: String(i + 1), aria: 'Screenshot ' + (i + 1), removeLabel: 'Remove screenshot ' + (i + 1), remove: () => this.setState({ n: Math.max(0, n - 1) }) })),
      total: String(n),
      countLabel: n === 1 ? '1 image' : n + ' images · one order',
      add: () => this.setState({ n: Math.min(5, n + 1) }),
      readLabel: n ? 'Read ' + n + (n === 1 ? ' image' : ' images') : 'Add an image first'
    };
  }
}
</script>
</body>
</html>
