name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, closed]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('frontend-pr-{0}', github.event.pull_request.number) || format('frontend-{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  build:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
      - run: npm ci
      - run: npm run quality
      - run: npm run build
  # Same build Coolify runs (Railpack + BuildKit), so a broken railpack.json fails here, not in a deploy.
  image:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILPACK_VERSION: 0.43.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - run: curl -fsSL https://railpack.com/install.sh | RAILPACK_VERSION=$RAILPACK_VERSION sh -s -- --yes --bin-dir "$HOME/.local/bin"
      - run: railpack prepare . --plan-out railpack-plan.json
      - run: docker buildx build --load -t kharcha-ci --build-arg BUILDKIT_SYNTAX=ghcr.io/railwayapp/railpack-frontend:v$RAILPACK_VERSION -f railpack-plan.json .
      - name: Runtime tools exist in the image
        run: docker run --rm --entrypoint sh kharcha-ci -c 'tesseract --version | head -1 && cd /app && .cas/bin/python -I -c "import casparser; print(casparser.__version__)" && test -f scripts/cas-to-json.py'
